  <text x="332" y="164" fill="#d29922" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">Local Public Field (No Allocator)</text>
  <text x="332" y="194" fill="#8b949e" font-family="'SFMono-Regular', Consolas, monospace" font-size="10">Commit &amp; rollback authority</text>

  <line x1="584" y1="133" x2="614" y2="133" stroke="#3fb950" stroke-width="2"/>
  <polygon points="614,128 623,133 614,138" fill="#3fb950"/>

  <rect x="624" y="52" width="248" height="162" rx="10" fill="#131922" stroke="#238636"/>
  <text x="640" y="76" fill="#3fb950" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">03 · EVALUATION PLANE</text>
  <text x="640" y="100" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Held-Out &amp; Ablation Gates</text>
  <text x="640" y="124" fill="#c9d1d9" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">Equal / UCB / Field Baselines</text>
