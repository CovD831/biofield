  <text x="44" y="164" fill="#3fb950" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">Intent · Bid · Refusal</text>
  <text x="44" y="194" fill="#8b949e" font-family="'SFMono-Regular', Consolas, monospace" font-size="10">No pre-assigned roles</text>

  <line x1="276" y1="133" x2="306" y2="133" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="306,128 315,133 306,138" fill="#58a6ff"/>

  <rect x="316" y="52" width="268" height="162" rx="10" fill="#131922" stroke="#58a6ff"/>
