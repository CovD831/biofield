  <text x="640" y="164" fill="#f85149" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">Honest Negative Gate Audits</text>
  <text x="640" y="194" fill="#8b949e" font-family="'SFMono-Regular', Consolas, monospace" font-size="10">Bounded Priors (O1 / O2)</text>
