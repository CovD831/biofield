<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Biofield Multi-Agent Differentiation Architecture">
  <rect x="1" y="1" width="898" height="238" rx="14" fill="#0d1117" stroke="#263143" stroke-width="1.5"/>
  <text x="32" y="32" fill="#a371f7" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" letter-spacing="1">BIOFIELD · FUNCTIONAL DIFFERENTIATION (D) &amp; EMERGENT ORGANIZATION (O1 / O2)</text>

  <rect x="28" y="52" width="248" height="162" rx="10" fill="#131922" stroke="#2d3b4e"/>
