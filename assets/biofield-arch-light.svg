  <text x="332" y="194" fill="#57606a" font-family="'SFMono-Regular', Consolas, monospace" font-size="10">Commit &amp; rollback authority</text>

  <line x1="584" y1="133" x2="614" y2="133" stroke="#1a7f37" stroke-width="2"/>
