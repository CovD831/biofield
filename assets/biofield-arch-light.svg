  <text x="44" y="194" fill="#57606a" font-family="'SFMono-Regular', Consolas, monospace" font-size="10">No pre-assigned roles</text>

  <line x1="276" y1="133" x2="306" y2="133" stroke="#0969da" stroke-width="2"/>
